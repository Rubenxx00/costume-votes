<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vota · Costume Party</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎃</text></svg>">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>🎃 <span id="event">Costume Party</span></h1>
      <p class="sub" id="who">Verifica del tuo token…</p>
    </div>
    <div style="text-align:right">
      <div id="closeLine" class="sub"></div>
      <a class="btn small" href="/results" id="resultsLink">Risultati</a>
      <button class="small" id="signout">Non sei tu?</button>
    </div>
  </header>

  <div id="alert" class="msg"></div>
  <div id="body"></div>

  <div class="card hidden" id="doneCard" style="text-align:center">
    <h2>🎉 Tutto fatto!</h2>
    <p class="sub">I tuoi voti sono stati registrati. Resta nei paraggi — i risultati alla chiusura.</p>
  </div>

  <div class="castbar hidden" id="castbar">
    <span class="cast-hint" id="castHint"></span>
    <button class="btn primary cast" id="castBtn" disabled>Invia</button>
  </div>

</div>
<script src="/lightbox.js"></script>
<script src="/vote.js"></script>
</body>
</html>
